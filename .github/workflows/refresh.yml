name: Refresh awesome list

on:
  schedule:
    # 每月 1 号 03:17 UTC（避开整点）
    - cron: '17 3 1 * *'
  workflow_dispatch:  # 手动触发

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup gh CLI
        run: |
          gh auth setup-git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run refresh script
        run: |
          python3 scripts/refresh.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH: gh
          REPO: ${{ github.repository }}
          OUT: repo-out

      - name: Commit & push changes
        run: |
          # 用生成的内容覆盖仓库
          cp -r repo-out/README.md ./README.md
          cp -r repo-out/topics/* ./topics/ 2>/dev/null || true
          mkdir -p topics
          cp -r repo-out/topics/* ./topics/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自动刷新 awesome 列表 ($(date -u +%Y-%m-%d))"
            git push
          fi
